<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Ensaios • Biblioteca</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />


<style>
* { margin: 0; padding: 0; box-sizing: border-box; }


body {
font-family: "Segoe UI", Arial, sans-serif;
overflow-x: hidden;
}


/* Vídeo de fundo */
.video-bg {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
z-index: -2;
}


/* Camada escura */
.overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.55);
z-index: -1;
}


header {
padding: 40px;
text-align: center;
color: #fff;
}


header h1 { font-size: 2.5em; margin-bottom: 10px; }
header p { opacity: 0.8; }


.grid {
max-width: 1100px;
margin: 40px auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 30px;
padding: 0 30px 80px;
}


.card {
background: rgba(20,20,20,0.75);
backdrop-filter: blur(4px);
padding: 20px;
border-radius: 12px;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
color: #fff;
text-align: center;
}


.card:hover {
transform: translateY(-6px);
box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}


canvas {
width: 100%;
border-radius: 6px;
margin-bottom: 15px;
}


.titulo {
font-size: 1em;
</html>
