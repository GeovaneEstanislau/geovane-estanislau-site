<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ensaios • Biblioteca</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", Arial, sans-serif; overflow-x: hidden; }
.video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.55); z-index:-1; }
header { padding:40px; text-align:center; color:#fff; }
header h1 { font-size:2.5em; margin-bottom:10px; }
header p { opacity:0.8; }
.grid { max-width:1100px; margin:40px auto; display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:30px; padding:0 30px 80px; }
.card { background: rgba(20,20,20,0.75); backdrop-filter: blur(4px); padding:20px; border-radius:12px; cursor:pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; color:#fff; text-align:center; }
.card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
canvas { width:100%; border-radius:6px; margin-bottom:15px; }
.titulo { font-size:1em; }
</style>
</head>
<body>

<video class="video-bg" autoplay muted loop>
  <source src="https://raw.githubusercontent.com/GeovaneEstanislau/geovane-estanislau-site/main/assets/videos/nuvem.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<header>
  <h1>Biblioteca de Ensaios</h1>
  <p>Clique no ensaio para ler</p>
</header>

<div class="grid" id="biblioteca"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

const totalEnsaios = 20; // ajuste conforme os PDFs que você tem
const basePDF = "https://raw.githubusercontent.com/GeovaneEstanislau/geovane-estanislau-site/main/pdfs/";
const biblioteca = document.getElementById("biblioteca");

for (let i = 1; i <= totalEnsaios; i++) {
    const arquivo = `ensaio${i}.pdf`;
    const url = basePDF + arquivo;

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => abrirPDF(arquivo);

    const canvas = document.createElement("canvas");
    const titulo = document.createElement("div");
    titulo.className = "titulo";
    titulo.innerText = `Ensaio ${i}`;

    card.appendChild(canvas);
    card.appendChild(titulo);
    biblioteca.appendChild(card);

    pdfjsLib.getDocument(url).promise.then(pdf => {
        pdf.getPage(1).then(page => {
            const viewport = page.getViewport({ scale: 0.6 });
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            page.render({ canvasContext: context, viewport: viewport });
        });
    }).catch(err => {
        console.error("Erro ao carregar PDF:", arquivo, err);
        titulo.innerText = `Erro ao carregar ${arquivo}`;
    });
}

function abrirPDF(arquivo) {
    window.open("leitura.html?file=" + arquivo, "_blank");
}
</script>

</body>
</html>
