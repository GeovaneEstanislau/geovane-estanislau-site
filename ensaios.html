<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Ensaios • Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        /* Vídeo de fundo */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Camada escura para leitura */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: -1;
        }

        header {
            padding: 40px;
            text-align: center;
            color: #fff;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.8;
        }

        .grid {
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 0 30px 80px;
        }

        .card {
            background: rgba(20,20,20,0.75);
            backdrop-filter: blur(4px);
            padding: 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: #fff;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .card p {
            font-size: 0.95em;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #fff;
            opacity: 0.6;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <!-- Vídeo em loop no fundo -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPOSITORIO/main/assets/videos/nuvem.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <header>
        <h1>Ensaios</h1>
        <p>Escolha um tema para leitura e reflexão</p>
    </header>

    <section class="grid">

        <!-- Exemplo de ensaios em PDF -->
        <div class="card" onclick="abrirPDF('perspectivas.pdf')">
            <h3>Perspectivas</h3>
            <p>A realidade implacável e a necessidade de ação.</p>
        </div>

        <div class="card" onclick="abrirPDF('riqueza.pdf')">
            <h3>Riqueza</h3>
            <p>O que realmente significa ser rico.</p>
        </div>

        <div class="card" onclick="abrirPDF('farol.pdf')">
            <h3>O Farol Que Não Brilha</h3>
            <p>Quando a luz conduz aos rochedos.</p>
        </div>

    </section>

    <footer>
        FreireAI • Espaço de Ensaios
    </footer>

<script>
    function abrirPDF(arquivo) {
        window.location.href = "leitura-pdf.html?file=" + arquivo;
    }
</script>

</body>
</html>
